{% extends 'base.html' %}
{% block title %}ログイン{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 mt-5">
            <h2 class="text-center mb-4"><i class="bi bi-book"></i> SIRISA</h2>
            <p class="text-center text-muted mb-4">学習補助プラットフォーム</p>

            <!-- エラー表示エリア -->
            <div id="auth-error" class="alert alert-danger d-none" role="alert"></div>
            <!-- ローディング表示 -->
            <div id="auth-loading" class="text-center d-none my-3">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">読み込み中...</span>
                </div>
                <p class="text-muted mt-2 small">認証処理中...</p>
            </div>

            <!-- Google サインイン -->
            <button id="btn-google" class="btn btn-outline-dark w-100 mb-3" onclick="signInWithGoogle()">
                <svg width="18" height="18" viewBox="0 0 48 48" class="me-2" style="vertical-align: text-bottom;">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Google でサインイン
            </button>

            <div class="text-center my-3">
                <span class="text-muted small">または</span>
            </div>

            <!-- メールリンク認証 -->
            <div id="email-form">
                <div class="mb-3">
                    <label for="email-input" class="form-label">メールアドレス</label>
                    <input type="email" id="email-input" class="form-control" placeholder="email@example.com" autofocus>
                </div>
                <p class="text-muted small text-center">
                    <i class="bi bi-envelope"></i> サインインリンクをメールに送信します
                </p>
                <button id="btn-email" class="btn btn-sirisa w-100 mb-3" onclick="sendEmailLink()">
                    <i class="bi bi-send"></i> メールリンクを送信
                </button>
            </div>

            <!-- メール送信完了メッセージ -->
            <div id="email-sent" class="d-none">
                <div class="alert alert-success">
                    <i class="bi bi-check-circle"></i>
                    サインインリンクを <strong id="sent-to-email"></strong> に送信しました。<br>
                    メール内のリンクをクリックしてログインしてください。
                </div>
                <p class="text-muted small text-center">メールが届かない場合は迷惑メールフォルダをご確認ください。</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- Firebase Web SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
(function() {
    // Firebase 初期化（authDomain は自ドメイン — nginx が /__/ を Firebase にプロキシ）
    const firebaseConfig = {
        apiKey: "{{ firebase_api_key }}",
        authDomain: "{{ firebase_auth_domain }}",
        projectId: "{{ firebase_project_id }}",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function showError(msg) {
        const el = document.getElementById('auth-error');
        el.textContent = msg;
        el.classList.remove('d-none');
    }
    function hideError() {
        document.getElementById('auth-error').classList.add('d-none');
    }
    function showLoading() {
        document.getElementById('auth-loading').classList.remove('d-none');
        document.getElementById('btn-google').disabled = true;
        var btnEmail = document.getElementById('btn-email');
        if (btnEmail) btnEmail.disabled = true;
    }
    function hideLoading() {
        document.getElementById('auth-loading').classList.add('d-none');
        document.getElementById('btn-google').disabled = false;
        var btnEmail = document.getElementById('btn-email');
        if (btnEmail) btnEmail.disabled = false;
    }

    // Firebase ID トークンをサーバに送信
    async function sendTokenToServer(user) {
        console.log('[SIRISA] sendTokenToServer: getting ID token...');
        const idToken = await user.getIdToken();
        console.log('[SIRISA] sendTokenToServer: posting to callback...');
        const resp = await fetch('{% url "accounts:firebase_callback" %}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ idToken: idToken }),
            credentials: 'same-origin',
        });
        console.log('[SIRISA] sendTokenToServer: response status =', resp.status);
        const data = await resp.json();
        console.log('[SIRISA] sendTokenToServer: response data =', data);
        if (data.status === 'ok') {
            window.location.href = data.redirect;
        } else {
            hideLoading();
            showError(data.message || '認証に失敗しました。');
        }
    }

    // Google サインイン（リダイレクト方式 — same-origin authDomain で動作）
    window.signInWithGoogle = function() {
        hideError();
        showLoading();
        console.log('[SIRISA] Starting Google sign-in with redirect...');
        var provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithRedirect(provider);
    };

    // リダイレクト後の結果を処理（ページ読み込み時に自動実行）
    auth.getRedirectResult().then(function(result) {
        if (result && result.user) {
            console.log('[SIRISA] getRedirectResult: user =', result.user.email);
            showLoading();
            sendTokenToServer(result.user).catch(function(err) {
                hideLoading();
                console.error('[SIRISA] sendTokenToServer error:', err);
                showError('サーバ認証に失敗しました: ' + err.message);
            });
        }
    }).catch(function(err) {
        console.error('[SIRISA] getRedirectResult error:', err);
        if (err.code) {
            showError('Google認証エラー [' + err.code + ']: ' + err.message);
        }
    });

    // メールリンク送信
    window.sendEmailLink = async function() {
        hideError();
        const email = document.getElementById('email-input').value.trim();
        if (!email) {
            showError('メールアドレスを入力してください。');
            return;
        }
        showLoading();
        try {
            const actionCodeSettings = {
                url: window.location.origin + '{% url "accounts:email_link_callback" %}',
                handleCodeInApp: true,
            };
            await auth.sendSignInLinkToEmail(email, actionCodeSettings);
            // メールアドレスを localStorage に保存（コールバック時に使用）
            window.localStorage.setItem('emailForSignIn', email);
            hideLoading();
            document.getElementById('email-form').classList.add('d-none');
            document.getElementById('email-sent').classList.remove('d-none');
            document.getElementById('sent-to-email').textContent = email;
        } catch (err) {
            hideLoading();
            console.error('[SIRISA] Email link error:', err);
            showError('メール送信エラー [' + (err.code || '') + ']: ' + err.message);
        }
    };

    // Enter キーでメール送信
    document.getElementById('email-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendEmailLink();
        }
    });
})();
</script>
{% endblock %}
