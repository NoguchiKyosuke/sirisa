{% extends 'base.html' %}
{% block title %}ログイン{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 mt-5">
            <h2 class="text-center mb-4"><i class="bi bi-book"></i> SIRISA</h2>
            <p class="text-center text-muted mb-4">学習補助プラットフォーム</p>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                    <div class="text-danger small mt-1">{{ error }}</div>
                    {% endfor %}
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-sirisa w-100 mb-3">
                    <i class="bi bi-box-arrow-in-right"></i> ログイン
                </button>
            </form>
            <div class="text-center">
                <a href="{% url 'accounts:register' %}" class="text-decoration-none">
                    アカウントをお持ちでない方はこちら
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
