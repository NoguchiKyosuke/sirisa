{% extends 'base.html' %}
{% block title %}メール認証中{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 mt-5">
            <h2 class="text-center mb-4"><i class="bi bi-book"></i> SIRISA</h2>

            <!-- エラー表示エリア -->
            <div id="auth-error" class="alert alert-danger d-none" role="alert"></div>

            <!-- ローディング表示 -->
            <div id="auth-loading" class="text-center my-4">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">読み込み中...</span>
                </div>
                <p class="text-muted mt-2">メールリンクを検証しています...</p>
            </div>

            <!-- メールアドレス入力（localStorage にメールがない場合） -->
            <div id="email-prompt" class="d-none">
                <p class="text-muted text-center mb-3">
                    サインインに使用したメールアドレスを入力してください。
                </p>
                <div class="mb-3">
                    <input type="email" id="email-input" class="form-control"
                           placeholder="email@example.com" autofocus>
                </div>
                <button class="btn btn-sirisa w-100" onclick="completeSignIn()">
                    <i class="bi bi-check-circle"></i> サインインを完了
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- Firebase Web SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
(function() {
    const firebaseConfig = {
        apiKey: "{{ firebase_api_key }}",
        authDomain: "{{ firebase_auth_domain }}",
        projectId: "{{ firebase_project_id }}",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function showError(msg) {
        document.getElementById('auth-loading').classList.add('d-none');
        const el = document.getElementById('auth-error');
        el.textContent = msg;
        el.classList.remove('d-none');
    }

    async function sendTokenToServer(user) {
        const idToken = await user.getIdToken();
        const resp = await fetch('{% url "accounts:firebase_callback" %}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ idToken: idToken }),
        });
        const data = await resp.json();
        if (data.status === 'ok') {
            window.localStorage.removeItem('emailForSignIn');
            window.location.href = data.redirect;
        } else {
            showError(data.message || '認証に失敗しました。');
        }
    }

    window.completeSignIn = async function() {
        const email = document.getElementById('email-input').value.trim();
        if (!email) {
            showError('メールアドレスを入力してください。');
            return;
        }
        document.getElementById('email-prompt').classList.add('d-none');
        document.getElementById('auth-loading').classList.remove('d-none');
        try {
            const result = await auth.signInWithEmailLink(email, window.location.href);
            await sendTokenToServer(result.user);
        } catch (err) {
            console.error('Email link sign-in error:', err);
            showError('サインインに失敗しました: ' + err.message);
        }
    };

    // ページロード時にメールリンクを自動検証
    if (auth.isSignInWithEmailLink(window.location.href)) {
        let email = window.localStorage.getItem('emailForSignIn');
        if (!email) {
            // 別デバイスでリンクを開いた場合 → メールアドレス入力を求める
            document.getElementById('auth-loading').classList.add('d-none');
            document.getElementById('email-prompt').classList.remove('d-none');
        } else {
            auth.signInWithEmailLink(email, window.location.href)
                .then(function(result) {
                    return sendTokenToServer(result.user);
                })
                .catch(function(err) {
                    console.error('Email link sign-in error:', err);
                    showError('サインインに失敗しました: ' + err.message);
                });
        }
    } else {
        showError('無効なリンクです。ログインページからやり直してください。');
        setTimeout(function() {
            window.location.href = '{% url "accounts:login" %}';
        }, 3000);
    }
})();
</script>
{% endblock %}
