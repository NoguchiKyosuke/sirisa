<div class="reaction-container d-flex gap-1 mt-2 pt-2 border-top">
    {% with user_reactions=answer.user_reactions %}
    <button class="btn btn-sm btn-outline-secondary reaction-btn {% if 'thumbs_up' in user_reactions %}active{% endif %}"
            onclick="toggleReaction({{ answer.pk }}, 'thumbs_up', this)"
            title="いいね">
        👍 <span data-count="thumbs_up" style="color: var(--bs-body-color, #333);">{{ answer.thumbs_up_count|default:"" }}</span>
    </button>
    <button class="btn btn-sm btn-outline-secondary reaction-btn {% if 'thumbs_down' in user_reactions %}active{% endif %}"
            onclick="toggleReaction({{ answer.pk }}, 'thumbs_down', this)"
            title="よくない">
        👎 <span data-count="thumbs_down" style="color: var(--bs-body-color, #333);">{{ answer.thumbs_down_count|default:"" }}</span>
    </button>
    <button class="btn btn-sm btn-outline-secondary reaction-btn {% if 'heart' in user_reactions %}active{% endif %}"
            onclick="toggleReaction({{ answer.pk }}, 'heart', this)"
            title="ハート">
        ❤️ <span data-count="heart" style="color: var(--bs-body-color, #333);">{{ answer.heart_count|default:"" }}</span>
    </button>
    <button class="btn btn-sm btn-outline-secondary reaction-btn {% if 'celebration' in user_reactions %}active{% endif %}"
            onclick="toggleReaction({{ answer.pk }}, 'celebration', this)"
            title="お祝い">
        🎉 <span data-count="celebration" style="color: var(--bs-body-color, #333);">{{ answer.celebration_count|default:"" }}</span>
    </button>
    <button class="btn btn-sm btn-outline-secondary reaction-btn {% if 'idea' in user_reactions %}active{% endif %}"
            onclick="toggleReaction({{ answer.pk }}, 'idea', this)"
            title="ひらめき">
        💡 <span data-count="idea" style="color: var(--bs-body-color, #333);">{{ answer.idea_count|default:"" }}</span>
    </button>
    {% endwith %}
</div>

<style>
.reaction-btn {
    border-radius: 20px;
    padding: 2px 8px;
    font-size: 0.85rem;
    transition: all 0.2s;
}
.reaction-btn:hover {
    transform: scale(1.1);
}
.reaction-btn.active {
    background-color: #e8f4f8;
    border-color: #0dcaf0;
}
</style>
