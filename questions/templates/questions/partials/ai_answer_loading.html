<div class="card mb-3 border-info" id="ai-answer-{{ answer.pk }}"
     hx-get="{% url 'questions:answer_status' answer.pk %}"
     hx-trigger="every 5s"
     hx-swap="outerHTML">
    <div class="card-body text-center py-4">
        <div class="spinner-border text-info mb-3" role="status">
            <span class="visually-hidden">生成中...</span>
        </div>
        <h6 class="text-info"><i class="bi bi-robot"></i> AI回答を生成中です...</h6>
        <p class="text-muted small mb-0">Gemini 2.0 Flash が回答を作成しています。しばらくお待ちください。</p>
        <div class="progress mt-3" style="height: 4px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-info" style="width: 100%"></div>
        </div>
    </div>
</div>
