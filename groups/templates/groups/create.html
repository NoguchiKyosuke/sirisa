{% extends 'base.html' %}
{% block title %}グループ作成{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card p-4">
            <h3 class="mb-4"><i class="bi bi-people"></i> 新しいグループを作成</h3>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_name" class="form-label fw-bold">グループ名</label>
                    {{ form.name }}
                    {% for error in form.name.errors %}
                    <div class="text-danger small mt-1">{{ error }}</div>
                    {% endfor %}
                </div>
                <div class="mb-3">
                    <label for="id_description" class="form-label fw-bold">説明（任意）</label>
                    {{ form.description }}
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-sirisa">
                        <i class="bi bi-plus-lg"></i> 作成
                    </button>
                    <a href="{% url 'groups:list' %}" class="btn btn-outline-secondary">キャンセル</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
